<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freeflow Dispatch Guide 2.0</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --g:#1a6b3a;--g2:#2a8c4e;--gl:#e8f5ed;--gd:#c6e6d0;
  --bg:#f0f2f5;--card:#fff;--surf:#f8fafc;
  --bd:#e2e8f0;--bd2:#cbd5e1;
  --txt:#0f172a;--txt2:#475569;--txt3:#94a3b8;
  --red:#dc2626;--redl:#fef2f2;--redb:#fecaca;
  --yel:#b45309;--yell:#fffbeb;--yelb:#fde68a;
  --blu:#1d4ed8;--blul:#eff6ff;--blub:#bfdbfe;
  --sb:#1e2530;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;font-size:14px;line-height:1.6}
#sidebar{width:230px;min-height:100vh;background:var(--sb);position:fixed;left:0;top:0;display:flex;flex-direction:column;z-index:100;overflow-y:auto}
#sidebar::-webkit-scrollbar{width:4px}
#sidebar::-webkit-scrollbar-thumb{background:#3d4a5c;border-radius:2px}
.sb-top{padding:16px 14px 12px;background:#1a3a28}
.sb-brand{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.sb-mark{width:32px;height:32px;background:rgba(255,255,255,.15);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.sb-name{font-size:12.5px;font-weight:700;color:#fff;line-height:1.2}
.sb-sub{font-size:9px;color:rgba(255,255,255,.5);font-family:'Courier New',monospace;margin-top:1px}
.sb-search{position:relative}
.sb-search input{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:7px 10px 7px 28px;color:#fff;font-size:11.5px;outline:none;font-family:inherit}
.sb-search input::placeholder{color:rgba(255,255,255,.35)}
.sb-search input:focus{background:rgba(255,255,255,.13)}
.sb-si{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.4);font-size:13px}
.sb-nav{flex:1;padding:8px 0 14px}
.sb-grp{font-size:9px;font-family:'Courier New',monospace;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.28);padding:10px 14px 3px;display:block}
.sb-item{display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;color:rgba(255,255,255,.55);font-size:12.5px;font-weight:500;transition:all .1s;border-left:2.5px solid transparent;user-select:none}
.sb-item:hover{color:#fff;background:rgba(255,255,255,.06)}
.sb-item.active{color:#fff;background:rgba(255,255,255,.1);border-left-color:#4ade80}
.sb-foot{padding:10px 12px;border-top:1px solid rgba(255,255,255,.06);background:rgba(0,0,0,.1)}
.admin-btn{width:100%;padding:7px 10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:6px;color:rgba(255,255,255,.6);font-size:11.5px;font-family:inherit;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:6px;justify-content:center}
.admin-btn:hover{background:rgba(255,255,255,.12);color:#fff}
.adot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.25);transition:background .2s}
.adot.on{background:#4ade80}
#main{margin-left:230px;flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{background:var(--card);border-bottom:1px solid var(--bd);padding:11px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.crumb{font-size:11.5px;color:var(--txt3);font-family:'Courier New',monospace;display:flex;align-items:center;gap:6px}
.crumb .ca{color:var(--txt2)}
.admin-bar{display:none;background:#f0fdf4;border-bottom:2px solid var(--gd);padding:8px 28px;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--g);font-weight:500}
.admin-bar.show{display:flex}
.content{padding:24px 32px 60px;flex:1}
.sec{display:none}
.sec.active{display:block;animation:fi .15s ease}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.sec-hdr{margin-bottom:20px;padding-bottom:16px;border-bottom:2px solid var(--bd);display:flex;align-items:flex-start;justify-content:space-between}
.sec-title{font-size:22px;font-weight:700;color:var(--txt);letter-spacing:-.02em}
.sec-desc{font-size:13px;color:var(--txt3);margin-top:3px}
.card{background:var(--card);border:1.5px solid var(--bd);border-radius:10px;padding:18px 20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card-title{font-size:13px;font-weight:700;color:var(--txt);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.ci{width:22px;height:22px;background:var(--gl);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--g)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.cc{background:var(--card);border:1.5px solid var(--bd);border-radius:10px;padding:14px 16px;transition:border-color .15s;position:relative}
.cc:hover{border-color:var(--gd)}
.cc-name{font-weight:700;color:var(--txt);font-size:13.5px}
.cc-role{font-size:10px;font-family:'Courier New',monospace;color:var(--g);margin:2px 0 6px}
.cc-info{font-size:12px;color:var(--txt2);line-height:1.9}
.cc-info a{color:var(--blu);text-decoration:none}
.cc-actions{display:none;position:absolute;top:8px;right:8px;gap:4px}
.admin-on .cc:hover .cc-actions{display:flex}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{background:var(--surf);color:var(--txt3);font-size:9.5px;font-family:'Courier New',monospace;letter-spacing:.08em;text-transform:uppercase;padding:8px 12px;text-align:left;border-bottom:1.5px solid var(--bd)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--bd);color:var(--txt2);vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--surf)}
.tbl td:first-child{color:var(--txt);font-weight:600}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:12px;align-items:flex-start}
.sn{width:24px;height:24px;background:var(--gl);border:1.5px solid var(--gd);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Courier New',monospace;font-size:11px;font-weight:500;color:var(--g);flex-shrink:0;margin-top:1px}
.sc{flex:1;padding-top:2px}
.st{font-weight:700;color:var(--txt);font-size:13px}
.sb2{color:var(--txt2);font-size:12.5px;margin-top:2px}
.alert{border-radius:8px;padding:11px 14px;margin:10px 0;font-size:12.5px;display:flex;gap:10px;align-items:flex-start;border:1px solid}
.a-urgent{background:var(--redl);border-color:var(--redb);color:var(--red)}
.a-note{background:var(--yell);border-color:var(--yelb);color:var(--yel)}
.a-info{background:var(--blul);border-color:var(--blub);color:var(--blu)}
.a-ok{background:var(--gl);border-color:var(--gd);color:var(--g)}
.ai{font-weight:700;flex-shrink:0}
.tag{display:inline-block;padding:2px 8px;border-radius:5px;font-size:11px;font-family:'Courier New',monospace;font-weight:500;border:1px solid;margin:2px 3px 2px 0}
.tg{background:var(--gl);color:var(--g);border-color:var(--gd)}
.tr{background:var(--redl);color:var(--red);border-color:var(--redb)}
.ty{background:var(--yell);color:var(--yel);border-color:var(--yelb)}
.tb{background:var(--blul);color:var(--blu);border-color:var(--blub)}
.tgr{background:var(--surf);color:var(--txt3);border-color:var(--bd)}
.email-block{background:var(--surf);border:1.5px solid var(--bd);border-radius:8px;padding:14px 16px;font-family:'Courier New',monospace;font-size:11.5px;color:var(--txt2);line-height:1.9;position:relative;white-space:pre-wrap}
.elbl{font-size:9.5px;font-family:'Courier New',monospace;letter-spacing:.09em;text-transform:uppercase;color:var(--txt3);margin-bottom:5px}
.cbtn{position:absolute;top:8px;right:8px;padding:3px 10px;background:var(--card);border:1px solid var(--bd2);border-radius:4px;font-size:10.5px;font-family:inherit;font-weight:600;color:var(--txt3);cursor:pointer}
.cbtn:hover{color:var(--g);border-color:var(--g)}
.coll-h{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:13px 16px;background:var(--card);border:1.5px solid var(--bd);border-radius:10px;margin-bottom:6px;user-select:none}
.coll-h:hover{background:var(--surf)}
.coll-h.open{border-color:var(--gd);background:var(--gl);border-radius:10px 10px 0 0;margin-bottom:0}
.coll-ht{font-weight:700;font-size:13px;color:var(--txt)}
.coll-h.open .coll-ht{color:var(--g)}
.coll-arr{font-size:10px;color:var(--txt3);transition:transform .2s}
.coll-h.open .coll-arr{transform:rotate(180deg)}
.coll-b{display:none;padding:16px;background:var(--card);border:1.5px solid var(--gd);border-top:none;border-radius:0 0 10px 10px;margin-bottom:6px}
.coll-b.open{display:block}
.pl{list-style:none}
.pi{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surf);border:1px solid var(--bd);border-radius:7px;margin-bottom:6px;font-size:12.5px;font-weight:500;color:var(--txt2)}
.pr{width:22px;height:22px;background:var(--gl);border:1px solid var(--gd);border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:'Courier New',monospace;font-size:11px;font-weight:700;color:var(--g);flex-shrink:0}
.cl{list-style:none}
.ci2{display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:12.5px;color:var(--txt2);cursor:pointer}
.ci2:last-child{border-bottom:none}
.cbox{width:17px;height:17px;border:1.5px solid var(--bd2);border-radius:5px;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;background:var(--card)}
.ci2.done .cbox{background:var(--g);border-color:var(--g)}
.ci2.done .cbox::after{content:'✓';font-size:10px;color:#fff;font-weight:700}
.ci2.done span{text-decoration:line-through;color:var(--txt3)}
.sla{display:inline-flex;align-items:center;gap:7px;background:var(--surf);border:1.5px solid var(--bd2);border-radius:20px;padding:6px 14px;font-size:12px;font-family:'Courier New',monospace;font-weight:500;margin:4px 8px 4px 0}
.sdot{width:8px;height:8px;border-radius:50%}
.mtrx{overflow-x:auto}
.mt{min-width:650px;width:100%;border-collapse:collapse;font-size:11.5px}
.mt th{background:var(--surf);color:var(--txt3);font-size:9px;font-family:'Courier New',monospace;letter-spacing:.06em;text-transform:uppercase;padding:8px 10px;text-align:center;border:1px solid var(--bd);white-space:nowrap}
.mt th:first-child{text-align:left;min-width:120px}
.mt td{padding:8px 10px;border:1px solid var(--bd);text-align:center;color:var(--txt2)}
.mt td:first-child{text-align:left;font-weight:700;color:var(--txt)}
.mt tr:hover td{background:var(--surf)}
.ck{color:var(--g);font-size:14px;font-weight:700}
.xk{color:var(--txt3)}
.btn{padding:6px 14px;border-radius:7px;font-size:12.5px;font-family:inherit;cursor:pointer;border:1.5px solid var(--bd2);background:var(--card);color:var(--txt2);font-weight:600;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.btn:hover{border-color:var(--g);color:var(--g);background:var(--gl)}
.btn-p{background:var(--g);border-color:var(--g2);color:#fff}
.btn-p:hover{background:var(--g2);color:#fff}
.btn-d{background:var(--redl);border-color:var(--redb);color:var(--red)}
.btn-sm{padding:4px 10px;font-size:11.5px}
.overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:500;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.overlay.open{display:flex}
.modal{background:var(--card);border:1.5px solid var(--bd);border-radius:14px;width:560px;max-width:96vw;max-height:90vh;overflow-y:auto;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal-lg{width:720px}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-title{font-size:17px;font-weight:800;color:var(--txt)}
.modal-close{width:28px;height:28px;border-radius:6px;border:1px solid var(--bd);background:var(--surf);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--txt3)}
.modal-close:hover{background:var(--redl);color:var(--red)}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--bd)}
.fg{margin-bottom:14px}
.fl{display:block;font-size:11px;font-family:'Courier New',monospace;color:var(--txt3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px}
.fi,.fta{width:100%;background:var(--card);border:1.5px solid var(--bd2);border-radius:7px;padding:8px 12px;color:var(--txt);font-size:13px;font-family:inherit;outline:none;transition:border-color .2s}
.fi:focus,.fta:focus{border-color:var(--g)}
.fta{min-height:90px;resize:vertical;line-height:1.6;font-family:'Courier New',monospace;font-size:12px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
h3{font-size:15px;font-weight:700;color:var(--txt);margin:18px 0 10px}
h4{font-size:13px;font-weight:600;color:var(--txt2);margin:12px 0 8px}
p{font-size:12.5px;color:var(--txt2);margin-bottom:8px}
ul,ol{margin:6px 0 10px 18px;font-size:12.5px;color:var(--txt2)}
li{margin-bottom:4px}
strong{color:var(--txt)}
a{color:var(--blu);text-decoration:none}
a:hover{text-decoration:underline}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--surf)}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}
</style>
</head>
<body>
<nav id="sidebar">
  <div class="sb-top">
    <div class="sb-brand">
      <div class="sb-mark">FF</div>
      <div><div class="sb-name">Freeflow Beverage</div><div class="sb-sub">Dispatch Guide v2.0</div></div>
    </div>
    <div class="sb-search">
      <span class="sb-si">⌕</span>
      <input type="text" id="srch" placeholder="Search..." autocomplete="off" oninput="doSearch(this.value)">
    </div>
  </div>
  <div class="sb-nav" id="nav"></div>
  <div class="sb-foot">
    <button class="admin-btn" onclick="openLogin()">
      <span class="adot" id="adot"></span><span id="albl">Admin Edit Mode</span>
    </button>
  </div>
</nav>
<div id="main">
  <div class="topbar">
    <div class="crumb">Dispatch Guide <span style="color:var(--bd2)">›</span> <span class="ca" id="crumb">Contacts</span></div>
    <div style="display:flex;gap:8px;align-items:center">
      <span id="savedlbl" style="font-size:11px;color:var(--txt3);font-family:'Courier New',monospace"></span>
      <button class="btn btn-sm" onclick="window.print()">🖨 Print</button>
    </div>
  </div>
  <div class="admin-bar" id="abar">
    <span>✏ Edit mode — hover any contact/tech/sub to see edit buttons</span>
    <button class="btn btn-d btn-sm" onclick="exitAdmin()">Exit Admin</button>
  </div>
  <div class="content" id="page">
    <div id="sec-contacts" class="sec active"></div>
    <div id="sec-techs" class="sec"></div>
    <div id="sec-subs" class="sec"></div>
    <div id="sec-morning" class="sec"></div>
    <div id="sec-dispatch" class="sec"></div>
    <div id="sec-weekends" class="sec"></div>
    <div id="sec-coverage" class="sec"></div>
    <div id="sec-sfwo" class="sec"></div>
    <div id="sec-sfcust" class="sec"></div>
    <div id="sec-ccna" class="sec"></div>
    <div id="sec-ccnacalls" class="sec"></div>
    <div id="sec-dupes" class="sec"></div>
    <div id="sec-installs" class="sec"></div>
    <div id="sec-esc" class="sec"></div>
    <div id="sec-global" class="sec"></div>
    <div id="sec-freshpet" class="sec"></div>
    <div id="sec-ncd" class="sec"></div>
    <div id="sec-atw" class="sec"></div>
    <div id="sec-monclus" class="sec"></div>
    <div id="sec-bluestar" class="sec"></div>
    <div id="sec-brookstone" class="sec"></div>
    <div id="sec-templates" class="sec"></div>
  </div>
</div>
<!-- MODALS -->
<div class="overlay" id="loginMo">
  <div class="modal" style="width:400px">
    <div class="modal-hdr"><div class="modal-title">Admin Access</div><button class="modal-close" onclick="closeM('loginMo')">✕</button></div>
    <div class="fg"><label class="fl">Password</label><input type="password" class="fi" id="lpass" placeholder="Enter password" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div id="lerr" style="color:var(--red);font-size:12px;display:none;margin-bottom:8px">Incorrect password</div>
    <div class="modal-foot"><button class="btn" onclick="closeM('loginMo')">Cancel</button><button class="btn btn-p" onclick="doLogin()">Unlock</button></div>
  </div>
</div>
<div class="overlay" id="contactMo">
  <div class="modal">
    <div class="modal-hdr"><div class="modal-title" id="cmt">Edit Contact</div><button class="modal-close" onclick="closeM('contactMo')">✕</button></div>
    <div class="frow"><div class="fg"><label class="fl">Name</label><input class="fi" id="cN"></div><div class="fg"><label class="fl">Role</label><input class="fi" id="cR"></div></div>
    <div class="frow"><div class="fg"><label class="fl">Phone</label><input class="fi" id="cP"></div><div class="fg"><label class="fl">Email</label><input class="fi" id="cE"></div></div>
    <div class="fg"><label class="fl">Notes</label><input class="fi" id="cNt"></div>
    <div class="modal-foot"><button class="btn" onclick="closeM('contactMo')">Cancel</button><button class="btn btn-p" id="cSv">Save</button></div>
  </div>
</div>
<div class="overlay" id="techMo">
  <div class="modal modal-lg">
    <div class="modal-hdr"><div class="modal-title" id="tmt">Edit Technician</div><button class="modal-close" onclick="closeM('techMo')">✕</button></div>
    <div class="frow"><div class="fg"><label class="fl">Name</label><input class="fi" id="tN"></div><div class="fg"><label class="fl">Title</label><input class="fi" id="tT"></div></div>
    <div class="frow"><div class="fg"><label class="fl">Vehicle</label><input class="fi" id="tV"></div><div class="fg"><label class="fl">Phone</label><input class="fi" id="tPh"></div></div>
    <div class="frow"><div class="fg"><label class="fl">Email</label><input class="fi" id="tE"></div><div class="fg"><label class="fl">Schedule</label><input class="fi" id="tSc"></div></div>
    <div class="fg"><label class="fl">Location</label><input class="fi" id="tLo"></div>
    <div class="fg"><label class="fl">Can Do (one per line)</label><textarea class="fta" id="tCD"></textarea></div>
    <div class="fg"><label class="fl">Cannot Do (one per line)</label><textarea class="fta" id="tCN"></textarea></div>
    <div class="modal-foot"><button class="btn" onclick="closeM('techMo')">Cancel</button><button class="btn btn-p" id="tSv">Save</button></div>
  </div>
</div>
<div class="overlay" id="subMo">
  <div class="modal">
    <div class="modal-hdr"><div class="modal-title" id="smt">Edit Sub</div><button class="modal-close" onclick="closeM('subMo')">✕</button></div>
    <div class="frow"><div class="fg"><label class="fl">Company</label><input class="fi" id="sN"></div><div class="fg"><label class="fl">SF Name</label><input class="fi" id="sSF"></div></div>
    <div class="fg"><label class="fl">Territory</label><input class="fi" id="sTr"></div>
    <div class="fg"><label class="fl">POC / Contact</label><input class="fi" id="sPOC"></div>
    <div class="fg"><label class="fl">Notes</label><input class="fi" id="sNt"></div>
    <div class="modal-foot"><button class="btn" onclick="closeM('subMo')">Cancel</button><button class="btn btn-p" id="sSv">Save</button></div>
  </div>
</div>
<div class="overlay" id="confirmMo">
  <div class="modal" style="width:380px">
    <div class="modal-hdr"><div class="modal-title">Confirm Delete</div><button class="modal-close" onclick="closeM('confirmMo')">✕</button></div>
    <p id="confMsg">Are you sure?</p>
    <div class="modal-foot"><button class="btn" onclick="closeM('confirmMo')">Cancel</button><button class="btn btn-d" id="confBtn">Delete</button></div>
  </div>
</div>
<script>

// ═══════════════════════════════════════════════════
// SUPABASE — Real-time database connection
// All changes sync to everyone instantly

const SB = {
  headers: {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + SUPABASE_KEY,
    'Content-Type': 'application/json',
    'Prefer': 'return=representation'
  },

  async get(table) {
    const r = await fetch(SUPABASE_URL + '/rest/v1/' + table + '?select=*&order=sort_order', {headers: this.headers});
    if (!r.ok) throw new Error('Failed to fetch ' + table);
    return r.json();
  },

  async insert(table, data) {
    const r = await fetch(SUPABASE_URL + '/rest/v1/' + table, {
      method: 'POST', headers: this.headers, body: JSON.stringify(data)
    });
    if (!r.ok) throw new Error('Failed to insert into ' + table);
    return r.json();
  },

  async update(table, id, data) {
    const r = await fetch(SUPABASE_URL + '/rest/v1/' + table + '?id=eq.' + id, {
      method: 'PATCH', headers: this.headers, body: JSON.stringify(data)
    });
    if (!r.ok) throw new Error('Failed to update ' + table);
    return r.json();
  },

  async delete(table, id) {
    const r = await fetch(SUPABASE_URL + '/rest/v1/' + table + '?id=eq.' + id, {
      method: 'DELETE', headers: this.headers
    });
    if (!r.ok) throw new Error('Failed to delete from ' + table);
    return r.ok;
  }
};

// Load all data from Supabase on startup
async function loadFromDB() {
  try {
    const [contacts, techs, subs] = await Promise.all([
      SB.get('contacts'),
      SB.get('techs'),
      SB.get('subs')
    ]);

    // Map DB format to app format
    D.contacts = contacts.map(c => ({
      id: c.id, name: c.name, role: c.role,
      phone: c.phone, email: c.email, notes: c.notes
    }));

    D.techs = techs.map(t => ({
      id: t.id, name: t.name, title: t.title,
      vehicle: t.vehicle, phone: t.phone, email: t.email,
      schedule: t.schedule, location: t.location,
      canDo: t.can_do ? t.can_do.split('|').map(x=>x.trim()).filter(Boolean) : [],
      cannotDo: t.cannot_do ? t.cannot_do.split('|').map(x=>x.trim()).filter(Boolean) : []
    }));

    D.subs = subs.map(s => ({
      id: s.id, name: s.name, sfName: s.sf_name,
      territory: s.territory, poc: s.poc, notes: s.notes
    }));

    buildNav();
    renderSec(curSec);
    document.getElementById('savedlbl').textContent = 'Live data loaded ✓';
  } catch(e) {
    console.error('DB load error:', e);
    document.getElementById('savedlbl').textContent = 'Using local data';
    buildNav();
    renderSec(curSec);
  }
}

// Override save functions to write to Supabase
async function saveContactToDB(data, id) {
  try {
    if (id) {
      await SB.update('contacts', id, {name:data.name,role:data.role,phone:data.phone,email:data.email,notes:data.notes});
    } else {
      const newId = uid();
      await SB.insert('contacts', {id:newId,name:data.name,role:data.role,phone:data.phone,email:data.email,notes:data.notes,sort_order:D.contacts.length+1});
      return newId;
    }
    document.getElementById('savedlbl').textContent = 'Saved to database ✓';
  } catch(e) { alert('Save failed: ' + e.message); }
}

async function saveTechToDB(data, id) {
  try {
    const dbData = {name:data.name,title:data.title,vehicle:data.vehicle,phone:data.phone,email:data.email,schedule:data.schedule,location:data.location,can_do:data.canDo.join('|'),cannot_do:data.cannotDo.join('|')};
    if (id) {
      await SB.update('techs', id, dbData);
    } else {
      const newId = uid();
      await SB.insert('techs', {id:newId,...dbData,sort_order:D.techs.length+1});
      return newId;
    }
    document.getElementById('savedlbl').textContent = 'Saved to database ✓';
  } catch(e) { alert('Save failed: ' + e.message); }
}

async function saveSubToDB(data, id) {
  try {
    const dbData = {name:data.name,sf_name:data.sfName,territory:data.territory,poc:data.poc,notes:data.notes};
    if (id) {
      await SB.update('subs', id, dbData);
    } else {
      const newId = uid();
      await SB.insert('subs', {id:newId,...dbData,sort_order:D.subs.length+1});
      return newId;
    }
    document.getElementById('savedlbl').textContent = 'Saved to database ✓';
  } catch(e) { alert('Save failed: ' + e.message); }
}

async function deleteFromDB(table, id) {
  try {
    await SB.delete(table, id);
    document.getElementById('savedlbl').textContent = 'Deleted ✓';
  } catch(e) { alert('Delete failed: ' + e.message); }
}

function showSec(id){
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.sb-item').forEach(b=>b.classList.remove('active'));

function toggleCheck(e){const i=e.target.closest('.ci2');if(i)i.classList.toggle('done')}
function copyText(btn){const t=btn.parentElement.innerText.replace(/^Copy\n?/,'').trim();navigator.clipboard.writeText(t).then(()=>{btn.textContent='Copied!';setTimeout(()=>btn.textContent='Copy',1500)})}
function doSearch(q){if(!q||q.length<2)return;const r=NAV.flatMap(g=>g.items).find(i=>i.label.toLowerCase().includes(q.toLowerCase()));if(r)showSec(r.id)}
function openLogin(){if(isAdmin){exitAdmin();return}document.getElementById('loginMo').classList.add('open');setTimeout(()=>document.getElementById('lpass').focus(),100)}
function doLogin(){if(document.getElementById('lpass').value===PASS){document.getElementById('lerr').style.display='none';closeM('loginMo');toggleAdmin(true)}else{document.getElementById('lerr').style.display='block'}}
function exitAdmin(){toggleAdmin(false)}
function toggleAdmin(on){isAdmin=on;document.body.classList.toggle('admin-on',on);document.getElementById('abar').classList.toggle('show',on);document.getElementById('adot').classList.toggle('on',on);document.getElementById('albl').textContent=on?'Exit Admin Mode':'Admin Edit Mode';renderSec(curSec)}
function openM(id){document.getElementById(id).classList.add('open')}
function closeM(id){document.getElementById(id).classList.remove('open')}
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open')}));
function openEdit(type,id){
  editId=id;editType=type;
  if(type==='contact'){const c=D.contacts.find(x=>x.id===id);document.getElementById('cmt').textContent='Edit Contact';document.getElementById('cN').value=c.name;document.getElementById('cR').value=c.role;document.getElementById('cP').value=c.phone;document.getElementById('cE').value=c.email;document.getElementById('cNt').value=c.notes;document.getElementById('cSv').onclick=saveContact;openM('contactMo')}
  else if(type==='tech'){const t=D.techs.find(x=>x.id===id);document.getElementById('tmt').textContent='Edit Technician';document.getElementById('tN').value=t.name;document.getElementById('tT').value=t.title;document.getElementById('tV').value=t.vehicle;document.getElementById('tPh').value=t.phone;document.getElementById('tE').value=t.email;document.getElementById('tSc').value=t.schedule;document.getElementById('tLo').value=t.location;document.getElementById('tCD').value=t.canDo.join('\n');document.getElementById('tCN').value=t.cannotDo.join('\n');document.getElementById('tSv').onclick=saveTech;openM('techMo')}
  else if(type==='sub'){const s=D.subs.find(x=>x.id===id);document.getElementById('smt').textContent='Edit Sub';document.getElementById('sN').value=s.name;document.getElementById('sSF').value=s.sfName;document.getElementById('sTr').value=s.territory;document.getElementById('sPOC').value=s.poc;document.getElementById('sNt').value=s.notes;document.getElementById('sSv').onclick=saveSub;openM('subMo')}
}
function openAdd(type){
  editId=null;editType=type;
  if(type==='contact'){document.getElementById('cmt').textContent='Add Contact';['cN','cR','cP','cE','cNt'].forEach(i=>document.getElementById(i).value='');document.getElementById('cSv').onclick=saveContact;openM('contactMo')}
  else if(type==='tech'){document.getElementById('tmt').textContent='Add Technician';['tN','tT','tV','tPh','tE','tSc','tLo','tCD','tCN'].forEach(i=>document.getElementById(i).value='');document.getElementById('tSv').onclick=saveTech;openM('techMo')}
  else if(type==='sub'){document.getElementById('smt').textContent='Add Sub';['sN','sSF','sTr','sPOC','sNt'].forEach(i=>document.getElementById(i).value='');document.getElementById('sSv').onclick=saveSub;openM('subMo')}
}
async function saveContact(){const d={name:document.getElementById('cN').value.trim(),role:document.getElementById('cR').value.trim(),phone:document.getElementById('cP').value.trim(),email:document.getElementById('cE').value.trim(),notes:document.getElementById('cNt').value.trim()};if(!d.name)return;if(editId){const i=D.contacts.findIndex(x=>x.id===editId);if(i>-1){D.contacts[i]={...D.contacts[i],...d};await saveContactToDB(d,editId)}}else{const newId=await saveContactToDB(d,null)||uid();D.contacts.push({id:newId,...d})};closeM('contactMo');renderSec('contacts')}
async function saveTech(){const d={name:document.getElementById('tN').value.trim(),title:document.getElementById('tT').value.trim(),vehicle:document.getElementById('tV').value.trim(),phone:document.getElementById('tPh').value.trim(),email:document.getElementById('tE').value.trim(),schedule:document.getElementById('tSc').value.trim(),location:document.getElementById('tLo').value.trim(),canDo:document.getElementById('tCD').value.split('\n').map(l=>l.trim()).filter(Boolean),cannotDo:document.getElementById('tCN').value.split('\n').map(l=>l.trim()).filter(Boolean)};if(!d.name)return;if(editId){const i=D.techs.findIndex(x=>x.id===editId);if(i>-1){D.techs[i]={...D.techs[i],...d};await saveTechToDB(d,editId)}}else{const newId=await saveTechToDB(d,null)||uid();D.techs.push({id:newId,...d})};closeM('techMo');renderSec('techs')}
async function saveSub(){const d={name:document.getElementById('sN').value.trim(),sfName:document.getElementById('sSF').value.trim(),territory:document.getElementById('sTr').value.trim(),poc:document.getElementById('sPOC').value.trim(),notes:document.getElementById('sNt').value.trim()};if(!d.name)return;if(editId){const i=D.subs.findIndex(x=>x.id===editId);if(i>-1){D.subs[i]={...D.subs[i],...d};await saveSubToDB(d,editId)}}else{const newId=await saveSubToDB(d,null)||uid();D.subs.push({id:newId,...d})};closeM('subMo');renderSec('subs')}
function confirmDel(type,id){const arr={contact:D.contacts,tech:D.techs,sub:D.subs}[type];const item=arr?.find(x=>x.id===id);document.getElementById('confMsg').textContent=`Delete "${item?.name||id}"? This cannot be undone.`;document.getElementById('confBtn').onclick=async()=>{const tblMap={contact:'contacts',tech:'techs',sub:'subs'};await deleteFromDB(tblMap[type],id);if(type==='contact')D.contacts=D.contacts.filter(x=>x.id!==id);else if(type==='tech')D.techs=D.techs.filter(x=>x.id!==id);else if(type==='sub')D.subs=D.subs.filter(x=>x.id!==id);closeM('confirmMo');renderSec({contact:'contacts',tech:'techs',sub:'subs'}[type])};openM('confirmMo')}

loadFromDB();
</script>
</body>
</html>
